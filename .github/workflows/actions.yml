name: Storth Compiler Workflow
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Make and GCC
      run: sudo apt-get install -y make nasm binutils gcc
    - name: Build (make)
      run: make
    # - name: Run tests
    #   run: make test

